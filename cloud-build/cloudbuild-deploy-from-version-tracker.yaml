timeout: 1200s
options:
  automapSubstitutions: true
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET

steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: publish deploy events from manifest bumps
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        apt-get update && apt-get install -y --no-install-recommends git python3-yaml && rm -rf /var/lib/apt/lists/*
        : > /workspace/deploy-events.tsv
        # GitHub-triggered Cloud Build checkouts can be shallow. Fetch minimal
        # history so we can compare against the previous manifest revision.
        git fetch --no-tags --depth=2 origin "${BRANCH_NAME:-main}" || true

        python3 - <<'PY'
        import os
        import subprocess
        import sys
        from pathlib import Path

        import yaml

        trigger_name = os.environ.get("_TRIGGER_NAME", "")
        deploy_env = (os.environ.get("_DEPLOY_ENV") or "").strip().lower()
        manifest_path_value = os.environ.get("_VERSION_TRACKER_MANIFEST_PATH")
        if not manifest_path_value:
            if deploy_env in ("dev", "test"):
                manifest_path_value = f"environments/{deploy_env}.yaml"
            elif trigger_name.endswith("-dev"):
                manifest_path_value = "environments/dev.yaml"
            elif trigger_name.endswith("-test"):
                manifest_path_value = "environments/test.yaml"
            else:
                # Final fallback for misconfigured triggers: infer from manifest
                # file changed in the current commit range.
                changed_files = set()
                diff_commands = [
                    ["git", "diff", "--name-only", "HEAD~1", "HEAD"],
                    ["git", "show", "--name-only", "--pretty=format:", "HEAD"],
                ]
                for cmd in diff_commands:
                    try:
                        output = subprocess.check_output(cmd, text=True)
                        changed_files = {
                            line.strip()
                            for line in output.splitlines()
                            if line.strip()
                        }
                        if changed_files:
                            break
                    except subprocess.CalledProcessError:
                        continue

                dev_changed = "environments/dev.yaml" in changed_files
                test_changed = "environments/test.yaml" in changed_files

                if dev_changed ^ test_changed:
                    manifest_path_value = (
                        "environments/dev.yaml" if dev_changed else "environments/test.yaml"
                    )
                    print(
                        "_VERSION_TRACKER_MANIFEST_PATH/_DEPLOY_ENV missing; "
                        f"inferred from changed file: {manifest_path_value}"
                    )
                else:
                    raise RuntimeError(
                        "_VERSION_TRACKER_MANIFEST_PATH is missing and fallback could not be inferred. "
                        "Set _VERSION_TRACKER_MANIFEST_PATH or _DEPLOY_ENV in trigger substitutions."
                    )
            print(f"_VERSION_TRACKER_MANIFEST_PATH not provided; defaulting to {manifest_path_value}")

        manifest_path = Path(manifest_path_value)
        if not manifest_path.exists():
            raise FileNotFoundError(f"Version tracker manifest not found: {manifest_path}")

        current = yaml.safe_load(manifest_path.read_text(encoding="utf-8")) or {}
        current_services = current.get("services") or {}

        branch_name = os.environ.get("BRANCH_NAME", "")
        previous_specs = [f"HEAD~1:{manifest_path.as_posix()}"]
        if branch_name:
            previous_specs.append(f"origin/{branch_name}~1:{manifest_path.as_posix()}")

        previous_services = None
        for spec in previous_specs:
            try:
                previous_raw = subprocess.check_output(["git", "show", spec], text=True)
                previous = yaml.safe_load(previous_raw) or {}
                previous_services = previous.get("services") or {}
                print(f"Using previous manifest from: {spec}")
                break
            except subprocess.CalledProcessError:
                continue

        if previous_services is None:
            print(
                f"No previous manifest found for {manifest_path} (for example first run or shallow checkout); "
                "skipping deploy event publish."
            )
            sys.exit(0)

        supported_service_keys = {
            "job-service": "census31-fwmt-job-service",
            "csv-service": "census31-fwmt-csv-service",
            "outcome-service": "census31-fwmt-outcome-service",
            "fulfillment-event-service": "census31-fwmt-fulfillment-event-service",
            "acceptance-tests": "census31-fwmt-acceptance-tests",
        }

        changed = []
        for service_key, new_version in current_services.items():
            old_version = previous_services.get(service_key)
            if old_version == new_version or new_version in (None, ""):
                continue

            repo_name = supported_service_keys.get(service_key)
            if repo_name is None and service_key.startswith("census31-fwmt-"):
                repo_name = service_key

            if repo_name is None:
                print(f"Skipping unsupported manifest service key: {service_key}")
                continue

            changed.append((service_key, repo_name, str(old_version), str(new_version)))

        if not changed:
            print("No supported service version changes detected")
            sys.exit(0)

        output_path = Path("/workspace/deploy-events.tsv")
        output_path.write_text(
            "".join(f"{service_key}\t{repo_name}\t{old_version}\t{new_version}\n" for service_key, repo_name, old_version, new_version in changed),
            encoding="utf-8",
        )

        for service_key, repo_name, old_version, new_version in changed:
            print(f"Deploy trigger: services.{service_key} {old_version} -> {new_version} ({repo_name})")
        PY

        if [[ ! -s /workspace/deploy-events.tsv ]]; then
          echo "No deploy events to publish"
          exit 0
        fi

        while IFS=$'\t' read -r service_key repo_name old_version new_version; do
          [[ -n "$service_key" ]] || continue
          gcloud pubsub topics publish \
            "projects/${_CI_PROJECT_ID}/topics/${_SERVICE_BUILD_EVENTS_TOPIC}" \
            --message="{}" \
            --attribute="REPO_NAME=$repo_name,SHORT_SHA=$new_version,STATUS=SUCCESS,DEPLOY_REQUESTED=true,DEPLOY_ENV=${_DEPLOY_ENV}"
        done < /workspace/deploy-events.tsv